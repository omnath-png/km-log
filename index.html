<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KM Log - Mileage & Trip Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
@media print { .no-print { display: none !important; } body { background: #fff !important; color: #000 !important; } }
</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-20">
<main class="max-w-xl mx-auto p-4 space-y-4">
  <div class="flex items-center justify-between py-2 border-b border-slate-200">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-md">🚗</div>
      <div>
        <h1 class="text-lg font-bold tracking-tight">KM Log</h1>
        <p class="text-xs text-slate-500">Mileage & Trip Tracker</p>
      </div>
    </div>
    <div class="flex gap-1 bg-slate-200 p-1 rounded-xl">
      <button id="t-entry" onclick="switchTab('entry')" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white text-emerald-600 shadow-sm">New Entry</button>
      <button id="t-report" onclick="switchTab('report')" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600">Report</button>
    </div>
  </div>

  <div id="sec-entry" class="space-y-4">
    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500">Trip Details</h2>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Date</label>
        <input type="date" id="f-date" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Purpose</label>
        <input type="text" id="f-purpose" placeholder="e.g. Client visit, Site inspection" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Passenger(s)</label>
        <input type="text" id="f-pax" placeholder="e.g. Mr. Tenzin" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50">
      </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-4">
      <div>
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500">Start Odometer</h2>
          <button onclick="fetchGps('from')" type="button" class="text-[11px] font-medium text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg border border-emerald-200 hover:bg-emerald-100 flex items-center gap-1">📍 Use GPS</button>
        </div>
        <div class="flex gap-2 items-center">
          <input type="text" id="f-from" placeholder="Start place" class="flex-1 px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50">
          <input type="number" inputmode="numeric" id="f-sk" placeholder="Start KM" oninput="calcDist()" class="w-28 px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 font-mono">
          <div id="box-s" class="relative w-14 h-14 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center overflow-hidden bg-slate-50 shrink-0 cursor-pointer">
            📷<input type="file" accept="image/*" capture="environment" onchange="handlePhoto('s',event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
          </div>
        </div>
      </div>

      <hr class="border-slate-100">

      <div>
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500">End Odometer</h2>
          <button onclick="fetchGps('to')" type="button" class="text-[11px] font-medium text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg border border-emerald-200 hover:bg-emerald-100 flex items-center gap-1">📍 Use GPS</button>
        </div>
        <div class="flex gap-2 items-center">
          <input type="text" id="f-to" placeholder="End place" class="flex-1 px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50">
          <input type="number" inputmode="numeric" id="f-ek" placeholder="End KM" oninput="calcDist()" class="w-28 px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 font-mono">
          <div id="box-e" class="relative w-14 h-14 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center overflow-hidden bg-slate-50 shrink-0 cursor-pointer">
            📷<input type="file" accept="image/*" capture="environment" onchange="handlePhoto('e',event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
          </div>
        </div>
      </div>

      <div id="dist-box" class="hidden p-3 bg-emerald-50 border border-emerald-200 rounded-xl flex items-center justify-between text-emerald-800">
        <span class="text-xs font-medium uppercase">Calculated Distance</span>
        <span id="dist-val" class="text-lg font-bold font-mono">0 km</span>
      </div>

      <div class="pt-2 border-t border-slate-100">
        <label class="flex items-center gap-2 cursor-pointer py-1">
          <input type="checkbox" id="f-haspol" onchange="togglePol(this.checked)" class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500">
          <span class="text-xs font-semibold text-slate-700">POL / Fuel Issue (Refill)</span>
        </label>
        <div id="pol-fields" class="hidden grid grid-cols-2 gap-2 mt-2">
          <div>
            <label class="block text-[11px] text-slate-500 mb-1">Litres (L)</label>
            <input type="number" step="0.1" inputmode="decimal" id="f-pollts" placeholder="e.g. 40.5" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 font-mono">
          </div>
          <div>
            <label class="block text-[11px] text-slate-500 mb-1">Amount</label>
            <input type="number" step="0.01" inputmode="decimal" id="f-polamt" placeholder="e.g. 3500.00" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 bg-slate-50 font-mono">
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">WhatsApp Destination</h2>
      <label class="block text-xs text-slate-500 mb-1">Send to (country code + number, or blank to prompt)</label>
      <input type="tel" id="f-wa" placeholder="e.g. 97517123456" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-slate-50 font-mono">
    </div>

    <div id="err" class="text-rose-600 text-sm font-medium px-1"></div>
    <div id="store-msg" class="text-xs text-slate-500 text-center">💾 Entries are auto-saved on this device</div>

    <button onclick="saveAndSend()" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2">
      📤 Save &amp; Send on WhatsApp
    </button>
    <button onclick="newTrip()" class="w-full py-3 px-4 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium rounded-xl text-sm">
      Start New Trip (Clear Form)
    </button>

    <div id="done-box" class="hidden bg-white border border-emerald-200 rounded-2xl p-4 shadow-sm space-y-3">
      <div class="text-emerald-600 font-semibold text-sm">Trip Saved Successfully ✓</div>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="openLastWA()" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-medium rounded-xl">Open WhatsApp Again</button>
        <button onclick="sharePhotos()" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-medium rounded-xl">Share with Photos</button>
      </div>
    </div>
  </div>

  <div id="sec-report" class="hidden space-y-4">
    <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500">Monthly Report</h2>
        <input type="month" id="rep-mon" onchange="renderReport()" class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-200 bg-slate-50">
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <div class="bg-slate-50 p-3 rounded-xl text-center"><span class="text-xs text-slate-500 block">Trips</span><b id="stat-n" class="text-lg font-bold font-mono">0</b></div>
        <div class="bg-slate-50 p-3 rounded-xl text-center"><span class="text-xs text-slate-500 block">Total KM</span><b id="stat-km" class="text-lg font-bold font-mono text-emerald-600">0</b></div>
        <div class="bg-slate-50 p-3 rounded-xl text-center"><span class="text-xs text-slate-500 block">POL Litres</span><b id="stat-lts" class="text-lg font-bold font-mono text-sky-600">0</b></div>
        <div class="bg-slate-50 p-3 rounded-xl text-center"><span class="text-xs text-slate-500 block">POL Amount</span><b id="stat-amt" class="text-lg font-bold font-mono text-indigo-600">0</b></div>
      </div>
      <div id="trip-list" class="space-y-3 pt-2"></div>
    </div>

    <button onclick="submitReport()" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2">
      📤 Submit Report on WhatsApp
    </button>
    <div class="grid grid-cols-2 gap-2">
      <button onclick="downloadCSV()" class="py-3 px-4 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium rounded-xl text-xs">Download CSV</button>
      <button onclick="downloadExcelFile()" class="py-3 px-4 bg-white border border-slate-200 hover:bg-slate-50 text-emerald-700 font-medium rounded-xl text-xs">Download Excel (.xls)</button>
    </div>
    <button onclick="window.print()" class="w-full py-3 px-4 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-medium rounded-xl text-xs">Print / Save PDF</button>
  </div>
</main>
<script>
const today = new Date().toISOString().slice(0,10);
document.getElementById('f-date').value = today;
document.getElementById('rep-mon').value = today.slice(0,7);

let files = {s: null, e: null}, thumbs = {s: '', e: ''}, bigs = {s: '', e: ''}, lastText = '';

function initAutoPickup() {
  const arr = getTrips();
  if(arr.length > 0) {
    document.getElementById('f-from').value = arr[0].to || '';
    document.getElementById('f-sk').value = arr[0].ek || '';
  }
}
initAutoPickup();

function fetchGps(field) {
  if(!navigator.geolocation) { alert('Geolocation is not supported'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude.toFixed(5);
    const lng = pos.coords.longitude.toFixed(5);
    document.getElementById('f-' + field).value = lat + ', ' + lng;
    if(field === 'sk' || field === 'ek' || field === 'from' || field === 'to') calcDist();
  }, () => { alert('Unable to retrieve location. Check permissions.'); }, {timeout: 10000, enableHighAccuracy: true});
}

function switchTab(t) {
  document.getElementById('sec-entry').classList.toggle('hidden', t !== 'entry');
  document.getElementById('sec-report').classList.toggle('hidden', t !== 'report');
  document.getElementById('t-entry').className = t === 'entry' ? 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-white text-emerald-600 shadow-sm' : 'px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600';
  document.getElementById('t-report').className = t === 'report' ? 'px-3 py-1.5 text-xs font-semibold rounded-lg bg-white text-emerald-600 shadow-sm' : 'px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600';
  if(t === 'report') renderReport();
}
function togglePol(checked) {
  document.getElementById('pol-fields').classList.toggle('hidden', !checked);
}
function calcDist() {
  const s = parseFloat(document.getElementById('f-sk').value);
  const e = parseFloat(document.getElementById('f-ek').value);
  const box = document.getElementById('dist-box');
  if(!isNaN(s) && !isNaN(e) && e >= s) {
    box.classList.remove('hidden');
    document.getElementById('dist-val').textContent = (e - s) + ' km';
  } else {
    box.classList.add('hidden');
  }
}
function compress(file, max, q, label) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * r; c.height = img.height * r;
      const ctx = c.getContext('2d');
      if(!ctx) { res(null); return; }
      ctx.drawImage(img, 0, 0, c.width, c.height);

      const nowStr = new Date().toLocaleString();
      const stampText = label + ' - ' + nowStr;
      ctx.font = 'bold 24px sans-serif';
      const tm = ctx.measureText(stampText);
      const pad = 14;
      const bw = tm.width + pad * 2;
      const bh = 48;
      const bx = c.width - bw - 16;
      const by = c.height - bh - 16;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(stampText, bx + pad, by + 32);

      c.toBlob(b => res({blob: b, url: c.toDataURL('image/jpeg', q)}), 'image/jpeg', q);
    };
    img.onerror = () => res(null);
    img.src = URL.createObjectURL(file);
  });
}
async function handlePhoto(k, ev) {
  const f = ev.target.files[0];
  if(!f) return;
  const label = k === 's' ? 'START KM' : 'END KM';
  const big = await compress(f, 1024, 0.7, label);
  const sm = await compress(f, 120, 0.5, label);
  if(!big) return;
  files[k] = new File([big.blob], k + '-km.jpg', {type: 'image/jpeg'});
  thumbs[k] = sm ? sm.url : '';
  bigs[k] = big.url;
  const box = document.getElementById('box-' + k);
  box.innerHTML = '<img src="' + big.url + '" class="absolute inset-0 w-full h-full object-cover"><input type="file" accept="image/*" capture="environment" onchange="handlePhoto(\'" + k + "\',event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">';
}
function getTrips() {
  try { return JSON.parse(localStorage.getItem('km_trips') || '[]'); } catch(e) { return []; }
}
function storeTrips(arr) {
  try { localStorage.setItem('km_trips', JSON.stringify(arr)); } catch(e) {}
}
function openWA(text) {
  const n = (document.getElementById('f-wa').value || '').replace(/\D/g, '');
  window.open((n ? 'https://wa.me/' + n : 'https://wa.me/') + '?text=' + encodeURIComponent(text), '_blank');
}
async function saveAndSend() {
  const date = document.getElementById('f-date').value;
  const purpose = document.getElementById('f-purpose').value.trim();
  const pax = document.getElementById('f-pax').value.trim();
  const from = document.getElementById('f-from').value.trim();
  const to = document.getElementById('f-to').value.trim();
  const s = parseFloat(document.getElementById('f-sk').value);
  const e = parseFloat(document.getElementById('f-ek').value);
  const hasPol = document.getElementById('f-haspol').checked;
  const polLts = document.getElementById('f-pollts').value.trim();
  const polAmount = document.getElementById('f-polamt').value.trim();
  const err = document.getElementById('err');
  let m = '';
  if(!from) m = 'Enter start place.';
  else if(isNaN(s)) m = 'Enter start KM.';
  else if(!files.s) m = 'Take start KM photo.';
  else if(!to) m = 'Enter end place.';
  else if(isNaN(e)) m = 'Enter end KM.';
  else if(!files.e) m = 'Take end KM photo.';
  else if(e < s) m = 'End KM must be ≥ start KM.';
  else if(!purpose) m = 'Enter purpose.';
  else if(!pax) m = 'Enter passenger(s).';
  else if(hasPol && (!polLts || !polAmount)) m = 'Enter POL litres and amount.';
  err.textContent = m;
  if(m) return;
  const dist = e - s;
  const polText = hasPol && polLts ? '\n⛽ POL Issued: ' + polLts + ' L | Amount: ' + polAmount : '';
  lastText = '🚗 *KM Entry*\nDate: ' + date + '\nFrom: ' + from + '\nTo: ' + to + '\nStart KM: ' + s + '\nEnd KM: ' + e + '\nDistance: ' + dist + ' km\nPurpose: ' + purpose + '\nPassenger: ' + pax + polText;
  const arr = getTrips();
  arr.unshift({
    id: Date.now(), date, from, to, sk: s, ek: e, dist, purpose, pax, 
    ts: thumbs.s, te: thumbs.e, sub: false, pol: hasPol, polLts: hasPol ? polLts : '', polAmount: hasPol ? polAmount : ''
  });
  storeTrips(arr);
  document.getElementById('done-box').classList.remove('hidden');
  localStorage.setItem('km_wa', document.getElementById('f-wa').value);
  
  openWA(lastText);

  // Automatically reset form and pickup End Place & End KM as new Start Place & Start KM
  document.getElementById('f-from').value = to;
  document.getElementById('f-sk').value = e;
  document.getElementById('f-to').value = '';
  document.getElementById('f-ek').value = '';
  document.getElementById('f-purpose').value = '';
  document.getElementById('f-pax').value = '';
  document.getElementById('f-haspol').checked = false;
  document.getElementById('f-pollts').value = '';
  document.getElementById('f-polamt').value = '';
  document.getElementById('pol-fields').classList.add('hidden');
  files = {s: null, e: null}; thumbs = {s: '', e: ''}; bigs = {s: '', e: ''};
  document.getElementById('box-s').innerHTML = '📷<input type="file" accept="image/*" capture="environment" onchange="handlePhoto(\'s\',event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">';
  document.getElementById('box-e').innerHTML = '📷<input type="file" accept="image/*" capture="environment" onchange="handlePhoto(\'e\',event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">';
  document.getElementById('dist-box').classList.add('hidden');
  try { localStorage.removeItem('km_draft'); } catch(e) {}
}
function openLastWA() { if(lastText) openWA(lastText); }
async function sharePhotos() {
  const fileArr = [files.s, files.e].filter(Boolean);
  try { if(navigator.canShare && navigator.canShare({files: fileArr})) await navigator.share({files: fileArr, text: lastText}); else alert('Photo sharing requires a phone browser.'); } catch(e) {}
}
function newTrip() {
  if(!confirm('Clear form for a new trip?')) return;
  ['f-from', 'f-to', 'f-purpose', 'f-pax', 'f-sk', 'f-ek', 'f-pollts', 'f-polamt'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
  document.getElementById('f-haspol').checked = false;
  document.getElementById('pol-fields').classList.add('hidden');
  document.getElementById('f-date').value = today;
  files = {s: null, e: null}; thumbs = {s: '', e: ''}; bigs = {s: '', e: ''}; lastText = '';
  document.getElementById('box-s').innerHTML = '📷<input type="file" accept="image/*" capture="environment" onchange="handlePhoto(\'s\',event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">';
  document.getElementById('box-e').innerHTML = '📷<input type="file" accept="image/*" capture="environment" onchange="handlePhoto(\'e\',event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">';
  document.getElementById('dist-box').classList.add('hidden');
  document.getElementById('done-box').classList.add('hidden');
  document.getElementById('err').textContent = '';
  try { localStorage.removeItem('km_draft'); } catch(e) {}
}
function renderReport() {
  const mon = document.getElementById('rep-mon').value;
  const arr = getTrips().filter(t => t.date.startsWith(mon)).sort((a,b) => a.date < b.date ? 1 : -1);
  const totalKm = arr.reduce((s,t) => s + t.dist, 0);
  const totalLts = arr.reduce((s,t) => s + (t.pol && t.polLts ? parseFloat(t.polLts) || 0 : 0), 0);
  const totalAmt = arr.reduce((s,t) => s + (t.pol && t.polAmount ? parseFloat(t.polAmount) || 0 : 0), 0);

  document.getElementById('stat-n').textContent = arr.length;
  document.getElementById('stat-km').textContent = totalKm;
  document.getElementById('stat-lts').textContent = totalLts.toFixed(1);
  document.getElementById('stat-amt').textContent = totalAmt.toFixed(2);

  document.getElementById('trip-list').innerHTML = arr.length ? arr.map(t => `
    <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-1 text-xs">
      <div class="flex justify-between font-semibold">
        <span>${t.date}</span>
        <span class="text-emerald-600">${t.dist} km</span>
      </div>
      <div class="text-sm font-medium text-slate-800">${t.from} → ${t.to}</div>
      <div class="text-slate-500">KM: ${t.sk} → ${t.ek} | Purpose: ${t.purpose} | Pax: ${t.pax}</div>
      ${t.pol && t.polLts ? '<div class="text-sky-700 font-medium">⛽ POL: '+t.polLts+' L | Amount: '+t.polAmount+'</div>' : ''}
      <div class="flex gap-1 pt-1">
        ${t.ts ? '<img src="'+t.ts+'" class="w-10 h-10 object-cover rounded">' : ''}
        ${t.te ? '<img src="'+t.te+'" class="w-10 h-10 object-cover rounded">' : ''}
      </div>
    </div>
  `).join('') : '<div class="text-center py-6 text-slate-400 text-sm">No trips this month</div>';
}
function submitReport() {
  const mon = document.getElementById('rep-mon').value;
  const arr = getTrips().filter(t => t.date.startsWith(mon));
  if(!arr.length) { alert('No trips in this month.'); return; }
  const total = arr.reduce((s,t) => s + t.dist, 0);
  const totalLts = arr.reduce((s,t) => s + (t.pol && t.polLts ? parseFloat(t.polLts) || 0 : 0), 0);
  const totalAmt = arr.reduce((s,t) => s + (t.pol && t.polAmount ? parseFloat(t.polAmount) || 0 : 0), 0);
  const deviceTimestamp = new Date().toLocaleString();
  const lines = arr.map((t,i) => {
    const pStr = t.pol && t.polLts ? ' | POL: ' + t.polLts + 'L (' + t.polAmount + ')' : '';
    return `${i+1}. ${t.date} | ${t.from} → ${t.to} | ${t.sk}-${t.ek} (${t.dist} km)${pStr} | ${t.purpose} | ${t.pax}`;
  }).join('\n');
  const polSum = totalLts > 0 ? '\nTotal POL: ' + totalLts.toFixed(1) + ' L | Amount: ' + totalAmt.toFixed(2) : '';
  const text = `📋 *KM Report – ${mon}*\n🕒 Submitted: ${deviceTimestamp}\nTrips: ${arr.length}\nTotal: ${total} km${polSum}\n\n${lines}`;
  const ids = new Set(arr.map(t => t.id));
  storeTrips(getTrips().map(t => ids.has(t.id) ? {...t, sub: true} : t));
  renderReport();
  openWA(text);
}
function downloadCSV() {
  const mon = document.getElementById('rep-mon').value;
  const arr = getTrips().filter(t => t.date.startsWith(mon));
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [['Date','From','To','Start KM','End KM','Distance','POL Litres','POL Amount','Purpose','Passenger','Status']]
    .concat(arr.map(t => [t.date, t.from, t.to, t.sk, t.ek, t.dist, t.pol ? t.polLts : '', t.pol ? t.polAmount : '', t.purpose, t.pax, t.sub ? 'Submitted' : 'Pending']));
  const blob = new Blob([rows.map(r => r.map(q).join(',')).join('\n')], {type: 'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'km-report-' + mon + '.csv'; a.click();
}
function downloadExcelFile() {
  const mon = document.getElementById('rep-mon').value;
  const arr = getTrips().filter(t => t.date.startsWith(mon));
  const totalKm = arr.reduce((s,t) => s + t.dist, 0);
  const totalLts = arr.reduce((s,t) => s + (t.pol && t.polLts ? parseFloat(t.polLts) || 0 : 0), 0);
  const totalAmt = arr.reduce((s,t) => s + (t.pol && t.polAmount ? parseFloat(t.polAmount) || 0 : 0), 0);
  const tableRows = arr.map((t, i) => `
    <tr>
      <td style="text-align:center;">${i + 1}</td>
      <td>${t.date}</td>
      <td>${t.from}</td>
      <td>${t.to}</td>
      <td style="text-align:right;">${t.sk}</td>
      <td style="text-align:right;">${t.ek}</td>
      <td style="text-align:right; font-weight:bold;">${t.dist}</td>
      <td style="text-align:right;">${t.pol ? t.polLts : '-'}</td>
      <td style="text-align:right;">${t.pol ? t.polAmount : '-'}</td>
      <td>${t.purpose}</td>
      <td>${t.pax}</td>
      <td>${t.sub ? 'Submitted' : 'Pending'}</td>
      <td style="text-align:center;">${t.ts ? '<img src="'+t.ts+'" width="100" height="100" style="object-fit:cover; border-radius:8px;" />' : 'No Image'}</td>
      <td style="text-align:center;">${t.te ? '<img src="'+t.te+'" width="100" height="100" style="object-fit:cover; border-radius:8px;" />' : 'No Image'}</td>
    </tr>
  `).join('');

  const htmlContent = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
    <head>
      <meta charset="utf-8">
      <title>KM Report - ${mon}</title>
      <style>
        table { border-collapse: collapse; width: 100%; font-family: sans-serif; font-size: 10pt; }
        th, td { border: 1px solid #d1d5db; padding: 10px; vertical-align: middle; }
        th { background-color: #059669; color: #ffffff; font-weight: bold; text-align: center; }
      </style>
    </head>
    <body>
      <h2>🚗 KM Report – ${mon}</h2>
      <p><b>Summary:</b> Total Trips: ${arr.length} | Total KM: ${totalKm} km | Total POL: ${totalLts.toFixed(1)} L (${totalAmt.toFixed(2)})</p>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Date</th>
            <th>From</th>
            <th>To</th>
            <th>Start KM</th>
            <th>End KM</th>
            <th>Distance (km)</th>
            <th>POL Litres</th>
            <th>POL Amount</th>
            <th>Purpose</th>
            <th>Passenger</th>
            <th>Status</th>
            <th>Start KM Photo</th>
            <th>End KM Photo</th>
          </tr>
        </thead>
        <tbody>
          ${tableRows}
        </tbody>
      </table>
    </body>
    </html>
  `;
  const blob = new Blob([htmlContent], { type: 'application/vnd.ms-excel' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'km-report-' + mon + '.xls'; a.click();
}
</script>
